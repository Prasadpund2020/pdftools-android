<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" fill="none">
  <defs>
    <clipPath id="brand-icon-clip">
      <rect x="10" y="10" width="100" height="100" rx="26" />
    </clipPath>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. ICON SQUIRCLE WITH 3D ORIGAMI CYCLING ARROWS               -->
  <!-- ============================================================== -->
  <rect x="10" y="10" width="100" height="100" rx="26" fill="#0b382c" />

  <g clip-path="url(#brand-icon-clip)">
    <!-- Lower Emerald Green Arrow -->
    <polygon
      points="60,90 43,77 60,64 60,70 75,57 92,52 92,66 75,83 60,83"
      fill="#00c476"
    />
    <polygon
      points="60,83 75,83 75,57 60,70"
      fill="#059e61"
    />

    <!-- Upper White Arrow -->
    <polygon
      points="60,22 77,35 60,48 60,42 45,55 28,60 28,46 45,29 60,29"
      fill="#ffffff"
    />
    <polygon
      points="60,29 45,29 45,55 60,42"
      fill="#cfded9"
    />
  </g>

  <!-- ============================================================== -->
  <!-- 2. WORDMARK TYPOGRAPHY                                         -->
  <!-- ============================================================== -->
  <!-- "freeconvertingtools" in a single flowing text node -->
  <text
    x="126"
    y="68"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="-0.02em"
  >
    <tspan fill="#00c476">free</tspan><tspan fill="#0b382c">convertingtools</tspan>
  </text>

  <!-- ".com" vertical text positioned safely after "tools" -->
  <g transform="translate(562, 44) rotate(90)">
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
      font-size="13"
      font-weight="700"
      letter-spacing="0.05em"
      fill="#6b7f77"
    >.com</text>
  </g>

  <!-- Subtitle: "FREE ONLINE FILE CONVERTER" -->
  <text
    x="128"
    y="93"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
    font-size="11.5"
    font-weight="700"
    letter-spacing="0.25em"
    fill="#4a5e55"
  >FREE ONLINE FILE CONVERTER</text>
</svg>
